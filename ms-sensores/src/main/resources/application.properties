# =====================================================================
#  ms-sensores  ->  http://localhost:8083
#  Lecturas SIMULADAS de humedad y temperatura (no hay sensores reales).
# =====================================================================
spring.application.name=ms-sensores
server.port=8083

# ---------- Base de datos MySQL propia de este microservicio ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/huerto_sensores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
