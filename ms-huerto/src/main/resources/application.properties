# =====================================================================
#  ms-huerto  ->  http://localhost:8082
#  Sectores y cultivos del huerto (catalogo compartido por las tablets).
# =====================================================================
spring.application.name=ms-huerto
server.port=8082

# ---------- Base de datos MySQL propia de este microservicio ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/huerto_sectores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Comunicacion entre microservicios ----------
# ms-huerto le pregunta a ms-usuarios si el responsable de un sector existe.
servicios.usuarios.url=${URL_MS_USUARIOS:http://localhost:8081}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
