# =====================================================================
#  ms-usuarios  ->  http://localhost:8081
#  Cuentas del huerto e inicio de sesion.
# =====================================================================
spring.application.name=ms-usuarios
server.port=8081

# ---------- Base de datos MySQL (una BD propia por microservicio) ----------
# createDatabaseIfNotExist=true -> si la BD no existe, MySQL la crea solo.
# Los valores ${VARIABLE:defecto} se pueden cambiar con variables de entorno.
# Por defecto: usuario root SIN contrasena (Laragon / XAMPP).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/huerto_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update -> crea/actualiza las tablas a partir de las clases @Entity (no borra datos)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (util para explicar en la defensa)
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
